# Story 1.0. Static console, SPA fallback, and nothing that leaks version
# information. Real TLS terminates at the edge in front of this.

server {
    listen       8081;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;

    # Container health, distinct from the API's /v1/health.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Runtime configuration, written by the entrypoint from environment.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files /config.json =404;
    }

    # Hashed assets are immutable; index.html never is, or a deploy would not
    # reach anyone still holding a cached copy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # DG-1: nothing guest-identifying may ever end up in a URL, so referrers
        # are trimmed and the console is a same-origin app behind the edge.
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
