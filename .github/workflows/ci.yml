name: ci

# Story 1.0 / AC-6: the three gates plus the boundary lint and the smoke test.
# Every job here can fail the build on its own. scripts/negative-controls.sh
# proves each one can go red - a gate that has never failed is not known to work.

# CI IS DISABLED, deliberately and reversibly (Tanim, 2026-09-04, before the first
# push). `workflow_dispatch` is the only trigger, so nothing runs on a push or a
# pull request, but the workflow stays in the repository, stays reviewable, and can
# be run on demand from the Actions tab.
#
# TO RE-ENABLE: restore the two lines below this block. Nothing else about the
# workflow changed, so re-enabling is a two-line diff rather than a rewrite.
#
#   push: { branches: [main] }
#   pull_request:
#
# Worth knowing before you do: the `container-images` job has NEVER run. Story 1.0's
# images were only ever built on substituted bases because every container registry
# was blocked here (docs/running-containers-without-a-registry.md), so that job is
# the first honest test of both Dockerfiles against the real `node:22-alpine` and
# `nginx:1.27-alpine`. Expect it to be the one that fails first, and treat that as
# the job doing its job.
on:
  workflow_dispatch:

env:
  CELL_NAME: ci-eu-west-1
  DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/jazzticketing
  DATABASE_URL_APP: postgres://jt_app:jt_app_local_only@127.0.0.1:5432/jazzticketing
  REDIS_URL: redis://127.0.0.1:6379
  FIXTURE_AUTH: "1"
  # Test-only, and safe to read: they apply solely to the throwaway service
  # containers in this workflow. The source carries no fallback for either, so CI
  # has to state them like any other environment.
  FIXTURE_AUTH_SECRET: ci-fixture-secret-throwaway-value
  CONTROL_PLANE_TOKEN_SECRET: ci-control-plane-secret-throwaway
  DATABASE_URL_CONTROL: postgres://jt_control:jt_control_local_only@127.0.0.1:5432/jazzticketing

jobs:
  build-and-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: GATE inward dependencies only (AC-1)
        run: npm run gate:boundaries

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: GATE contracts are the schema of record (AC-2)
        run: npm run gate:codegen-drift

  sla-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # AD-14 requires BOTH languages. Without Dart this job is RED, by design.
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - run: npm ci
      - name: GATE one SLA fold, two languages, same vectors (AC-3)
        run: npm run gate:sla-fixtures

  isolation-and-cell:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: jazzticketing }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: migrations applied from source (AC-5)
        run: npm run migrate
      - name: GATE the built artifact actually runs (AC-5)
        # Tests import TypeScript. This runs `node dist/...`, which is what ships.
        run: npm run gate:built-artifact
      - name: GATE cross-tenant isolation (AC-4)
        run: npm run gate:isolation
      - name: GATE control plane holds no guest data (AC-5)
        run: npm run gate:control-plane
      - name: smoke - the cell actually runs (AC-5)
        run: npm run smoke
      - name: unit tests
        run: npm run test:unit

  container-images:
    # The gate in `npm run gate:containers` checks these definitions statically on
    # every commit. THIS job is what proves the containerised cell actually runs -
    # it builds both images and stands the whole cell up. It exists because the
    # environment Story 1.0 was written in had every container registry blocked, so
    # the images had never been built when the story was delivered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: GATE container definitions (static)
        run: npm run gate:containers
      - name: build the api image
        run: docker build -t jazzticketing/api:ci .
      - name: build the console image
        run: docker build -t jazzticketing/console:ci ./clients/console
      - name: compose smoke - the containerised cell runs
        # Defaults (api 3001, console 8081, postgres 5433, redis 6380) are what a
        # developer machine uses; the runner has no conflicts either way.
        run: bash scripts/compose-smoke.sh
